apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: vm-api-availability
  project: production
spec:
  displayName: API availability
  service: api
  target: 0.999
  window: 1d
  connection: vm-prod
  queries:
    good: sum(increase_prometheus(http_requests_total{service="api",code="200"}[1m]))
    total: sum(increase_prometheus(http_requests_total{service="api"}[1m]))
    language: metricsql
  policies:
    - name: fast-burn
      severity: critical
      shortWindow: 5m
      longWindow: 1h
      burnRate: 14.4
      for: 2m
    - name: sustained-burn
      severity: warning
      shortWindow: 30m
      longWindow: 6h
      burnRate: 6
      for: 5m
