apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: api-availability
  project: production
spec:
  displayName: API availability
  service: api
  target: 0.999
  connection: dash0-production
  queries:
    window:
      good: http_requests_total{service="api",code="200"}
      total: http_requests_total{service="api"}
  policies:
    - name: fast-burn
      severity: critical
      shortWindow: 5m
      longWindow: 1h
      burnRate: 14.4
      for: 2m
    - name: sustained-burn
      severity: warning
      shortWindow: 30m
      longWindow: 6h
      burnRate: 6
      for: 5m
