# Read-only first review. Set expectedRevision for an existing SLO.
# Optional digest pins and history are described in docs/public/intents.md.
plan:
  intent:
    apiVersion: nines.dev/v1alpha1
    kind: ServiceLevelObjectiveIntent
    metadata:
      name: api-success-intent
      project: production
    spec:
      description: Production API request attempts should complete successfully.
      service: api
      source: primary
      outcome: availability
      population:
        service: api
        environment: production
      target: 0.999
      windowSeconds: 2419200
      noDataPolicy: unknown
      stepSeconds: 60
      measurement:
        type: availability
        metric: http_requests_total
        labels:
          service: api
          environment: production
        successLabels:
          status: '200'
        scrapeIntervalSeconds: 15
        observationPoint: Completed API requests, including failures. Requests never
          reaching the server are excluded.
      policy:
        shortWindow: 5m
        longWindow: 1h
        burnRate: 14.4
        forSeconds: 120
        minCoverage: 1
expectedRevision: 0
alternatives:
- name: stricter-target
  target: 0.9999
- name: shorter-window
  window: 24h
