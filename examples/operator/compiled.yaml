apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
    annotations:
        nines.dev/project: commerce
    name: checkout-availability
    namespace: team-commerce
spec:
    connection: primary
    displayName: Checkout availability
    policies:
        - burnRate: 14.4
          for: 2m
          longWindow: 1h
          name: fast-burn
          severity: critical
          shortWindow: 5m
        - burnRate: 6
          for: 5m
          longWindow: 6h
          name: sustained-burn
          severity: warning
          shortWindow: 30m
    queries:
        window:
            good: checkout_attempts_total{service="checkout",outcome="success"}
            total: checkout_attempts_total{service="checkout"}
    service: checkout
    step: 1m
    target: 0.999
    window: 28d
---
apiVersion: nines.dev/v1beta1
kind: CriticalUserJourney
metadata:
    annotations:
        nines.dev/project: commerce
    name: purchase
    namespace: team-commerce
spec:
    criticality: high
    description: Observe server completion for eligible checkout attempts.
    displayName: Complete a purchase
    owner: team-commerce
    slos:
        - dimension: availability
          id: checkout-availability
          required: true
    steps:
        - actor: user
          id: checkout
          name: Complete checkout
          sloRefs:
            - checkout-availability
