apiVersion: nines.dev/v1beta1
kind: MeasurementBinding
metadata:
  name: api-success
  project: production
spec:
  displayName: API request success
  service: api
  type: availability
  metric: http_requests_total
  labels:
    environment: production
    service: api
  successLabels:
    status: "200"
  scrapeInterval: 15s
  observationPoint: Completed server requests at the API boundary; request attempts, not unique users
