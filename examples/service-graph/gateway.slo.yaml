apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: graph-gateway-availability
  project: playground
spec:
  displayName: Gateway request success
  service: gateway
  target: 0.99
  window: 5m
  step: 10s
  connection: primary
  measurement:
    type: availability
    metric: example_http_requests_total
    labels:
      environment: playground
      service: gateway
    successLabels:
      outcome: success
    scrapeInterval: 5s
    observationPoint: Requests completed by the gateway process in the local HTTP chain.
  policies: []
