apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: graph-checkout-availability
  project: playground
spec:
  displayName: Checkout request success
  service: checkout
  target: 0.99
  window: 5m
  step: 10s
  connection: primary
  measurement:
    type: availability
    metric: example_http_requests_total
    labels:
      environment: playground
      service: checkout
    successLabels:
      outcome: success
    scrapeInterval: 5s
    observationPoint: Requests completed by the checkout process in the local HTTP chain.
  policies: []
