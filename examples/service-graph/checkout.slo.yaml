apiVersion: nines.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: graph-checkout-availability
  project: playground
spec:
  displayName: Checkout request success
  service: checkout
  source: primary
  target: 0.99
  windowSeconds: 300
  stepSeconds: 10
  measurement:
    type: availability
    metric: example_http_requests_total
    labels: {service: checkout, environment: playground}
    successLabels: {outcome: success}
    scrapeIntervalSeconds: 5
    observationPoint: Requests completed by the checkout process in the local HTTP chain.
