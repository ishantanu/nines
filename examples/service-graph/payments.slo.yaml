apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: graph-payments-availability
  project: playground
spec:
  displayName: Payments request success
  service: payments
  target: 0.99
  window: 5m
  step: 10s
  connection: primary
  measurement:
    type: availability
    metric: example_http_requests_total
    labels:
      environment: playground
      service: payments
    successLabels:
      outcome: success
    scrapeInterval: 5s
    observationPoint: Requests completed by the payments process in the local HTTP chain.
  policies: []
