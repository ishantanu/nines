apiVersion: nines.dev/v1beta1
kind: CriticalUserJourney
metadata:
  name: graph-checkout
  project: playground
spec:
  displayName: Complete the example checkout
  description: Receive a successful response through the instrumented HTTP chain.
  owner: commerce
  criticality: high
  slos:
    - id: graph-gateway-availability
      required: true
    - id: graph-checkout-availability
      required: true
    - id: graph-payments-availability
      required: true
  steps:
    - id: enter
      name: Submit request
      actor: user
      sloRefs: [graph-gateway-availability]
    - id: checkout
      name: Process checkout
      actor: service
      dependsOn: [enter]
      sloRefs: [graph-checkout-availability]
    - id: pay
      name: Authorize payment
      actor: service
      dependsOn: [checkout]
      sloRefs: [graph-payments-availability]
