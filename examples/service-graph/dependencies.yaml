apiVersion: nines.dev/v1beta1
kind: ServiceDependencyMap
metadata:
  name: checkout-services
  project: playground
spec:
  displayName: Checkout HTTP dependencies
  services:
    - name: gateway
      displayName: Gateway
      sloRefs: [graph-gateway-availability]
    - name: checkout
      displayName: Checkout
      sloRefs: [graph-checkout-availability]
    - name: payments
      displayName: Payments
      sloRefs: [graph-payments-availability]
  dependencies:
    - caller: gateway
      callee: checkout
      critical: true
    - caller: checkout
      callee: payments
      critical: true
  observed:
    labels:
      environment: playground
      job: playground-service-graph
    window: 1m
    scrapeInterval: 5s
    maxSampleAge: 15s
