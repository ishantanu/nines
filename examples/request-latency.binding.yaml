apiVersion: nines.dev/v1alpha1
kind: MeasurementBinding
metadata:
  name: api-latency
  project: production
spec:
  displayName: API requests under 300 milliseconds
  service: api
  source: primary
  measurement: latency
  metric: http_request_duration_seconds
  labels:
    service: api
    environment: production
  thresholdSeconds: 0.3
  stepSeconds: 60
  observationPoint: Completed request durations at the API server; includes all status codes
