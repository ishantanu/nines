publicURLEnv: NINES_PUBLIC_URL
sessionHours: 12
providers:
  - id: local
    name: Local account
    type: local
    bootstrapUsername: admin
    bootstrapPasswordEnv: NINES_BOOTSTRAP_PASSWORD
bootstrap:
  - tenant: default
    provider: local
    subject: admin
    role: owner

platformAdmins:
  - provider: local
    subject: admin
