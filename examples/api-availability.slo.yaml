apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: api-availability
  project: production
spec:
  displayName: API availability
  service: gateway
  target: 0.999
  window: 1d
  queries:
    good: sum(increase(http_requests_total{code!~"5.."}[1m]))
    total: sum(increase(http_requests_total[1m]))
  policies:
    - name: fast-burn
      severity: critical
      shortWindow: 5m
      longWindow: 1h
      burnRate: 14.4
      for: 2m
    - name: sustained-burn
      severity: warning
      shortWindow: 30m
      longWindow: 6h
      burnRate: 6
      for: 5m
