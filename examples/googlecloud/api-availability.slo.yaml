apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: checkout-availability
  project: production
spec:
  displayName: Checkout availability
  service: checkout
  target: 0.999
  connection: google-checkout
  queries:
    good: metric.type = "custom.googleapis.com/nines/requests" AND resource.type = "global" AND metric.labels.result = "good"
    total: metric.type = "custom.googleapis.com/nines/requests" AND resource.type = "global"
    language: googlecloud
  policies:
    - name: fast-burn
      severity: critical
      shortWindow: 5m
      longWindow: 1h
      burnRate: 14.4
      for: 2m
    - name: sustained-burn
      severity: warning
      shortWindow: 30m
      longWindow: 6h
      burnRate: 6
      for: 5m
