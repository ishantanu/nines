apiVersion: nines.dev/v1beta1
kind: ServiceLevelObjective
metadata:
  name: newrelic-api-availability
  project: production
spec:
  displayName: API availability
  service: api
  target: 0.999
  window: 1d
  connection: newrelic-prod
  queries:
    good: SELECT count(*) FROM NinesRequest WHERE service = 'api' AND success = true
    total: SELECT count(*) FROM NinesRequest WHERE service = 'api'
    language: nrql
  policies:
    - name: fast-burn
      severity: critical
      shortWindow: 5m
      longWindow: 1h
      burnRate: 14.4
      for: 2m
    - name: sustained-burn
      severity: warning
      shortWindow: 30m
      longWindow: 6h
      burnRate: 6
      for: 5m
