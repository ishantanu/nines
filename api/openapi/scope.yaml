# Scope of the OpenAPI contract (v1alpha1.yaml), enforced by contract_test.go.
#
# Every stable route the server registers is in the contract, except the
# browser routes below, which sit outside the bearer-token API, with the
# reason. Experimental routes are marked x-nines-maturity: experimental.
browser:
  GET /auth/cli/authorize: page the browser opens during CLI sign-in
  GET /auth/oidc/{provider}/callback: browser sign-in redirect
  GET /auth/oidc/{provider}/login: browser sign-in redirect
  GET /auth/providers: sign-in page
  GET /auth/session: browser session
  POST /auth/cli/approve: browser approval during CLI sign-in
  POST /auth/cli/ldap: browser sign-in form during CLI sign-in
  POST /auth/cli/password: browser sign-in form during CLI sign-in
  POST /auth/ldap/{provider}/login: browser sign-in
  POST /auth/local/{provider}/login: browser sign-in
  POST /auth/local/setup: browser page where a person sets their password from a setup link
  POST /auth/logout: browser session
  POST /auth/logout-all: browser session
