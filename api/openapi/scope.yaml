# be removed from it.
browser:
  GET /auth/cli/authorize: page the browser opens during CLI sign-in
  GET /auth/oidc/{provider}/callback: browser sign-in redirect
  GET /auth/oidc/{provider}/login: browser sign-in redirect
  GET /auth/providers: sign-in page
  GET /auth/session: browser session
  POST /auth/cli/approve: browser approval during CLI sign-in
  POST /auth/ldap/{provider}/login: browser sign-in
  POST /auth/local/{provider}/login: browser sign-in
  POST /auth/logout: browser session
  POST /auth/logout-all: browser session
