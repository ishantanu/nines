# Scope of the OpenAPI contract (v1alpha1.yaml), enforced by contract_test.go.
#
# browser: routes outside the bearer-token API contract, with the reason.
# uncovered: stable routes not yet in the contract (#73). This list may only
# shrink: a new stable route must be documented, and a documented route must
# be removed from it.
browser:
  GET /auth/cli/authorize: page the browser opens during CLI sign-in
  GET /auth/oidc/{provider}/callback: browser sign-in redirect
  GET /auth/oidc/{provider}/login: browser sign-in redirect
  GET /auth/providers: sign-in page
  GET /auth/session: browser session
  POST /auth/cli/approve: browser approval during CLI sign-in
  POST /auth/ldap/{provider}/login: browser sign-in
  POST /auth/local/{provider}/login: browser sign-in
  POST /auth/logout: browser session
  POST /auth/logout-all: browser session
uncovered:
  - DELETE /api/connections/{connection}
  - GET /api/audit
  - GET /api/audit/archive
  - GET /api/audit/{id}
  - GET /api/connections
  - GET /api/connections/{connection}/metrics
  - GET /api/connections/{connection}/telemetry
  - GET /api/events
  - GET /api/resources/search
  - GET /api/skills
  - GET /api/skills/{id}
  - GET /api/slo-templates
  - GET /api/slo-templates/{template}
  - GET /api/topology/resources
  - GET /api/workspace
  - POST /api/connections
  - POST /api/connections/{connection}/test
  - POST /api/slo-templates/{template}/render
  - POST /auth/cli/exchange
  - POST /auth/cli/ldap
  - POST /auth/cli/logout
  - POST /auth/cli/password
  - POST /auth/cli/start
  - PUT /api/connections/{connection}
