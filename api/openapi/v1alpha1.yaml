components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Nines API key or CLI session token. Browser session authentication is outside this
        profile.
  parameters:
    Tenant:
      name: X-Nines-Tenant
      in: header
      required: false
      description: Select an authorized Nines tenant. Required when the server cannot select a default
        or unique tenant.
      schema: &id003
        type: string
    ID:
      name: id
      in: path
      required: true
      schema: *id003
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted nonnegative expected configuration revision, for example "0".
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
  responses:
    Error:
      description: Error; the HTTP status and error message describe the failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    MigrationRequest:
      type: object
      additionalProperties: false
      required: [tool, content]
      properties:
        tool:
          type: string
          enum: [sloth, pyrra]
        content:
          type: string
          maxLength: 1048576
        project: {type: string}
        source: {type: string}
        windowSeconds: {type: integer, format: int64}
        lifecycle:
          type: string
          enum: [experimental, aspirational, committed]
    MigrationNote:
      type: object
      additionalProperties: false
      required: [level, message]
      properties:
        level:
          type: string
          enum: [info, review, lossy]
        field: {type: string}
        message: {type: string}
    MigrationDefinition:
      type: object
      additionalProperties: false
      required: [name, origin, yaml, notes]
      properties:
        name: {type: string}
        origin: {type: string}
        yaml: {type: string}
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MigrationNote'
    MigrationSkipped:
      type: object
      additionalProperties: false
      required: [origin, reason]
      properties:
        origin: {type: string}
        reason: {type: string}
    MigrationResult:
      type: object
      additionalProperties: false
      required: [apiVersion, tool, definitions, skipped, notes, limitations]
      properties:
        apiVersion: {type: string}
        tenant: {type: string}
        tool: {type: string}
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/MigrationDefinition'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MigrationSkipped'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MigrationNote'
        limitations:
          type: array
          items: {type: string}
    GitInfo:
      type: object
      additionalProperties: false
      required: [apiVersion, tenant, configured]
      properties:
        apiVersion: {type: string}
        tenant: {type: string}
        configured: {type: boolean}
        provider: {type: string}
        repository: {type: string}
        baseBranch: {type: string}
        path: {type: string}
    GitPullRequest:
      type: object
      additionalProperties: false
      required: [number, url, branch, state, title, createdAt]
      properties:
        number: {type: integer}
        url: {type: string}
        branch: {type: string}
        state:
          type: string
          enum: [open, merged, closed]
        title: {type: string}
        definitionDigest: {type: string}
        expectedRevision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    GitReceipt:
      type: object
      additionalProperties: false
      required: [apiVersion, created, path, pullRequest]
      properties:
        apiVersion: {type: string}
        created: {type: boolean}
        path: {type: string}
        pullRequest:
          $ref: '#/components/schemas/GitPullRequest'
    GitProposalResult:
      type: object
      additionalProperties: false
      required: [receipt, definitionDigest, expectedRevision, limitations]
      properties:
        receipt:
          $ref: '#/components/schemas/GitReceipt'
        definitionDigest: {type: string}
        expectedRevision: {type: integer, format: int64}
        limitations:
          type: array
          items: {type: string}
    GitProposalStatus:
      type: object
      required: [number, url, branch, state, title, createdAt, applied]
      properties:
        number: {type: integer}
        url: {type: string}
        branch: {type: string}
        state:
          type: string
          enum: [open, merged, closed]
        title: {type: string}
        definitionDigest: {type: string}
        expectedRevision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        applied:
          type: boolean
          description: True only when the merged definition equals the live one.
    GitDrift:
      type: object
      additionalProperties: false
      required: [apiVersion, tenant, state, path, limitations]
      properties:
        apiVersion: {type: string}
        tenant: {type: string}
        state:
          type: string
          enum: [in_sync, drifted, not_in_repo, not_applied, unreadable]
        path: {type: string}
        repositoryDigest: {type: string}
        liveDigest: {type: string}
        limitations:
          type: array
          items: {type: string}
    GitProposalList:
      type: object
      additionalProperties: false
      required: [apiVersion, tenant, configured, proposals, limitations]
      properties:
        apiVersion: {type: string}
        tenant: {type: string}
        configured: {type: boolean}
        liveDigest: {type: string}
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/GitProposalStatus'
        limitations:
          type: array
          items: {type: string}
    IntentPreparationCheck:
      type: object
      additionalProperties: false
      required: [code, state, message]
      properties:
        code: {type: string}
        state:
          type: string
          enum: [missing, invalid, recorded, stale, not_recorded, not_checked]
        message: {type: string}
    IntentEvidence:
      additionalProperties: false
      properties:
        adapterCalls:
          type: integer
        apiVersion:
          type: string
        catalogDigest:
          type: string
        comparisons:
          items:
            $ref: '#/components/schemas/IntentEvidenceComparison'
          type: array
        digest:
          type: string
        expectedRevision:
          type: integer
        humanConfirmationRequired:
          type: boolean
          const: true
        intentDigest:
          type: string
        maxAdapterCalls:
          type: integer
        measurementDigest:
          type: string
        observedAt:
          format: date-time
          type: string
        sourceDigest:
          type: string
        state:
          type: string
          enum:
          - observed
          - partial
          - unsupported
        tenant:
          type: string
        warnings:
          items:
            type: string
          type: array
      required:
      - apiVersion
      - tenant
      - observedAt
      - intentDigest
      - measurementDigest
      - sourceDigest
      - catalogDigest
      - expectedRevision
      - state
      - adapterCalls
      - maxAdapterCalls
      - comparisons
      - warnings
      - humanConfirmationRequired
      - digest
      type: object
    IntentEvidenceAlternative:
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: Unique comparison ID other than baseline.
        policies:
          items:
            $ref: '#/components/schemas/BurnRatePolicy'
          type: array
        target:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        window:
          type: string
          maxLength: 32
          description: Positive whole-second duration with units within 31 days, for example
            24h. Subsecond and unitless windows are rejected.
      required:
      - name
      type: object
    IntentEvidenceComparison:
      additionalProperties: false
      properties:
        allowedBadEventsPerMillion:
          type: number
        current:
          anyOf:
          - $ref: '#/components/schemas/IntentEvidenceCurrent'
          - type: 'null'
        gaps:
          items:
            type: string
          type: array
        history:
          anyOf:
          - $ref: '#/components/schemas/IntentEvidenceHistory'
          - type: 'null'
        historyState:
          type: string
        lifecycleAllowsAlerts:
          type: boolean
        name:
          type: string
        policies:
          items:
            $ref: '#/components/schemas/IntentPolicyTradeoff'
          type: array
        state:
          type: string
        target:
          type: number
        windowSeconds:
          type: integer
      required:
      - lifecycleAllowsAlerts
      - name
      - state
      - target
      - windowSeconds
      - allowedBadEventsPerMillion
      - policies
      - historyState
      - gaps
      type: object
    IntentEvidenceCurrent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        burnRate:
          anyOf:
          - type: number
          - type: 'null'
        checks:
          items:
            $ref: '#/components/schemas/QualityCheck'
          type: array
        coverage:
          type: number
        dataStatus:
          type: string
        freshness:
          $ref: '#/components/schemas/Freshness'
        from:
          format: date-time
          type: string
        good:
          type: number
        minimumEvents:
          type: number
        reliability:
          anyOf:
          - type: number
          - type: 'null'
        state:
          type: string
        total:
          type: number
      required:
      - state
      - at
      - from
      - good
      - total
      - coverage
      - reliability
      - burnRate
      - dataStatus
      - freshness
      - minimumEvents
      - checks
      type: object
    IntentEvidenceHistory:
      additionalProperties: false
      properties:
        burnThresholdCutoffs:
          type: integer
        completeCutoffs:
          type: integer
        from:
          format: date-time
          type: string
        noTrafficCutoffs:
          type: integer
        resolutionSeconds:
          type: integer
        targetViolationCutoffs:
          type: integer
        to:
          format: date-time
          type: string
        unknownCutoffs:
          type: integer
      required:
      - from
      - to
      - resolutionSeconds
      - completeCutoffs
      - unknownCutoffs
      - noTrafficCutoffs
      - targetViolationCutoffs
      - burnThresholdCutoffs
      type: object
    IntentEvidenceInput:
      additionalProperties: false
      properties:
        alternatives:
          items:
            $ref: '#/components/schemas/IntentEvidenceAlternative'
          type: array
          maxItems: 2
        catalogDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Optional exact pin from a prior receipt. If omitted, current provenance
            is captured at request start. Never confirmation or approval.
        expectedRevision:
          type: integer
          minimum: 0
        history:
          $ref: '#/components/schemas/IntentEvidenceRange'
        intentDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Optional exact pin from a prior receipt. If omitted, current provenance
            is captured at request start. Never confirmation or approval.
        measurementDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Optional exact pin from a prior receipt. If omitted, current provenance
            is captured at request start. Never confirmation or approval.
        plan:
          type: object
          properties:
            intent:
              $ref: '#/components/schemas/SLOIntent'
          required:
          - intent
          additionalProperties: false
          description: Complete inline measurement; separate binding references are not
            accepted.
        sourceDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Optional exact pin from a prior receipt. If omitted, current provenance
            is captured at request start. Never confirmation or approval.
      required:
      - plan
      - expectedRevision
      type: object
    IntentEvidenceRange:
      additionalProperties: false
      properties:
        from:
          format: date-time
          type: string
        resolutionSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Aligned to stepSeconds; explicit range at most 72h and 240 cutoffs.
        to:
          format: date-time
          type: string
      required:
      - from
      - to
      - resolutionSeconds
