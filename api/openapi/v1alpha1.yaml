components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Nines API key or CLI session token. Browser session authentication is outside this profile.
  parameters:
    Tenant:
      name: X-Nines-Tenant
      in: header
      required: false
      description: Select an authorized Nines tenant. Required when the server cannot select a default or unique tenant.
      schema:
        type: string
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted nonnegative expected configuration revision, for example "0".
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
  responses:
    Error:
      description: Error; the HTTP status and error message describe the failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AgenticContract:
      additionalProperties: false
      properties:
        approvalRequired:
          type: boolean
        maxCostUSD:
          type: number
        maxDurationSeconds:
          type: integer
        maxSteps:
          type: integer
        successDefinition:
          type: string
      required:
        - approvalRequired
        - successDefinition
      type: object
    AlertEvent:
      additionalProperties: false
      properties:
        configRevision:
          type: integer
        id:
          type: string
        kind:
          type: string
        longBurn:
          type: number
        policy:
          type: string
        reason:
          type: string
        severity:
          type: string
        shortBurn:
          type: number
        sloId:
          type: string
        time:
          format: date-time
          type: string
      required:
        - id
        - kind
        - longBurn
        - shortBurn
        - sloId
        - time
      type: object
    AlertState:
      additionalProperties: false
      properties:
        firingSince:
          format: date-time
          type: string
        lastEvaluated:
          format: date-time
          type: string
        pendingSince:
          format: date-time
          type: string
        phase:
          type: string
        policies:
          additionalProperties:
            $ref: '#/components/schemas/AlertState'
          type: object
        policy:
          type: string
        policyDigest:
          type: string
        severity:
          type: string
        suppressedReason:
          type: string
      required:
        - phase
      type: object
    AppendIntentConversation:
      type: object
      additionalProperties: false
      required:
        - id
        - expectedVersion
        - text
      properties:
        id:
          type: string
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 2000
        preserveGoal:
          type: boolean
        goal:
          $ref: '#/components/schemas/Manifest'
    BadIntervalPolicy:
      additionalProperties: false
      properties:
        errorRate:
          type: number
        minEvents:
          type: number
        minGoodEvents:
          type: number
      type: object
    BindingHealth:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        binding:
          $ref: '#/components/schemas/BindingReference'
        checkedAt:
          format: date-time
          type: string
        code:
          type: string
        evaluationBlocked:
          type: boolean
        fingerprint:
          type: string
        measurementDigest:
          type: string
        message:
          type: string
        sloRevision:
          type: integer
        sourceDigest:
          type: string
        state:
          type: string
        tenant:
          type: string
      required:
        - apiVersion
        - checkedAt
        - code
        - evaluationBlocked
        - message
        - sourceDigest
        - state
        - tenant
      type: object
    BindingReference:
      additionalProperties: false
      properties:
        digest:
          type: string
        name:
          type: string
        revision:
          type: integer
      required:
        - digest
        - name
        - revision
      type: object
    BudgetBand:
      additionalProperties: false
      properties:
        below:
          type: number
        name:
          type: string
        response:
          type: string
      required:
        - below
        - name
        - response
      type: object
    BudgetBandMatch:
      additionalProperties: false
      properties:
        below:
          type: number
        name:
          type: string
        response:
          type: string
      required:
        - below
        - name
