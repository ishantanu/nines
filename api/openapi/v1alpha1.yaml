components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Nines API key or CLI session token. Browser session authentication is outside this profile.
  parameters:
    Tenant:
      name: X-Nines-Tenant
      in: header
      required: false
      description: Select an authorized Nines tenant. Required when the server cannot select a default or unique tenant.
      schema:
        type: string
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted nonnegative expected configuration revision, for example "0".
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
  responses:
    Error:
      description: Error; the HTTP status and error message describe the failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AccessBinding:
      additionalProperties: false
      properties:
        credentialRef:
          type: string
        role:
          type: string
      required:
        - credentialRef
        - role
      type: object
    AccessPermission:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        roles:
          additionalProperties:
            type: boolean
          type:
            - object
            - 'null'
      required:
        - id
        - label
        - roles
      type: object
    AccessView:
      additionalProperties: false
      properties:
        authentication:
          type: string
        bindings:
          items:
            $ref: '#/components/schemas/AccessBinding'
          type:
            - array
            - 'null'
        bindingsVisible:
          type: boolean
        currentRole:
          type: string
        management:
          type: string
        permissions:
          items:
            $ref: '#/components/schemas/AccessPermission'
          type:
            - array
