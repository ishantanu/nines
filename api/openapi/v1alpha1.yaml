      operationId: applyResource
      summary: Apply a reviewed resource manifest
      description: Requires the quoted expected revision. Owner-configured automatic rule delivery may run after the definition is saved; this response does not prove evaluation.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IfMatch'
