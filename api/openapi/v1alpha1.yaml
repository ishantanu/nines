      operationId: getSLOManifest
      summary: Read versioned SLO YAML
      description: ''
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/Manifest'
          headers:
            ETag:
              description: Quoted current configuration revision.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/resources/validate:
    post:
      operationId: validateResource
      summary: Validate a resource manifest
      description: Validation does not check telemetry or activate recording rules.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/Manifest'
  /api/resources/plan:
    post:
      operationId: planResource
      summary: Plan a resource manifest
      description: Review the returned revision and warnings before applying.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePlan'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/Manifest'
  /api/resources/apply:
    post:
      operationId: applyResource
      summary: Apply a reviewed resource manifest
      description: Requires the quoted expected revision. Owner-configured automatic rule delivery may
        run after the definition is saved; this response does not prove evaluation.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceRevision'
          headers:
            ETag:
              description: Quoted saved revision.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/Manifest'
  /api/gitops:
    get:
      operationId: getGitDelivery
      summary: Read whether Git delivery is configured
      description: Returns the tenant's repository, base branch and path when optional Git delivery is configured. Never returns a credential.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitInfo'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
  /api/gitops/proposals:
    post:
      operationId: proposeGitDefinition
      summary: Open a pull request for a reviewed SLO definition
      description: Opens a branch, commits the reviewed SLO or journey definition and opens a pull request (GitHub) or merge request (GitLab) in the tenant's configured repository. It never applies, merges or deploys. The server re-plans the definition and refuses with 409 unless the quoted If-Match revision and the X-Nines-Plan-Digest header equal that plan. Requires an owner or editor; agents and viewers are refused. Returns 201 for a new pull request and 200 when an identical proposal already has one.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/IfMatch'
      - name: X-Nines-Plan-Digest
        in: header
        required: true
        description: Digest from the reviewed plan of the same definition.
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: An identical proposal already has a pull request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProposalResult'
        '201':
          description: A pull request was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProposalResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/Manifest'
  /api/slos/{id}/gitops/proposals:
    get:
      operationId: listGitProposals
      summary: List Git proposals for an SLO
      description: Recent pull requests Nines opened for this SLO, read from the Git provider on request. A merged proposal is applied only when its digest equals the live definition's digest.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProposalList'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
  /api/slos/{id}/gitops/drift:
    get:
      operationId: getGitDrift
      summary: Compare an SLO with its repository file
      description: Compares the definition file on the configured base branch with the saved definition by digest. Reports in_sync, drifted, not_in_repo, not_applied or unreadable. A difference is reported, not resolved. Reads the provider on request and writes nothing.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitDrift'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
  /api/journeys/{id}/gitops/proposals:
    get:
      operationId: listGitJourneyProposals
      summary: List Git proposals for a journey
      description: Recent pull or merge requests Nines opened for this journey. A merged proposal is applied only when its digest equals the live journey digest.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProposalList'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
  /api/journeys/{id}/gitops/drift:
    get:
      operationId: getGitJourneyDrift
      summary: Compare a journey with its repository file
      description: Compares the journey definition file on the configured base branch with the saved journey by digest, with the same states as SLO drift.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitDrift'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '502': *id001
        '503': *id001
  /api/migrations/convert:
    post:
      operationId: convertMigration
      summary: Convert Sloth or Pyrra definitions into Nines SLO definitions
      description: Stateless and read-only. Converts one or more Sloth or Pyrra definitions into Nines SLO YAML and reports every approximation as a note and every definition that cannot be converted faithfully as skipped, with the reason. Nothing is saved, planned or applied; review each definition, then use plan and apply. Imported SLOs start experimental unless another lifecycle is requested, so Nines does not page while the original rules still run.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/usage:
    get:
      operationId: getIntentUsage
      summary: Read aggregate intent workflow progress
      description: Counts of conversations that reached each workflow stage and median times, computed from this tenant's stored conversations. Read-only; returns no actor, goal text, measurement or telemetry value and sends nothing outside the server. Describes workflow progress, not SLO health or correctness.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: days
        in: query
        required: false
        description: Window in days for conversations created in the window. Defaults to 90.
        schema:
          type: integer
          minimum: 1
          maximum: 365
      responses:
        '200':
          description: Aggregate usage with limitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentUsage'
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/{id}/activation:
    get:
      operationId: inspectIntentActivation
      summary: Inspect current runtime activation of an applied intent
      description: Explicit bounded provider reads (ten seconds overall) against administrator-configured destinations. Returns an as-of receipt fenced to applied resource revisions and source identity. Never publishes rules, collects samples, changes definitions or persists an outcome. Saved verification and workflow status remain provider-free.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      responses:
        '200':
          description: As-of activation evidence; inspect state and code, not only HTTP success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentActivation'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/{id}/status:
    get:
      operationId: getIntentWorkflowStatus
      summary: Read saved workflow status
      description: Does not run a model or grant authorization.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatus'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/{id}/review-artifact:
    get:
      operationId: getIntentReviewArtifact
      summary: Export an audit-verified review snapshot
      description: Contains sensitive definitions and review notes. Concurrent changes and incomplete
        or invalid audit evidence fail the export.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewArtifact'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/{id}/messages:
    post:
      operationId: appendIntentAnswer
      summary: Add clarification context or a replacement typed goal
      description: preserveGoal keeps existing typed commitments and measurement unchanged while adding context. It cannot accompany a replacement goal. Every new answer invalidates prior confirmation and pending proposals; exact retries are idempotent. This operation cannot apply resources.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendIntentConversation'
      responses:
        '200':
          description: Saved conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentConversation'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/intent-conversations/{id}/evidence:
    post:
      operationId: recordIntentEvidence
      summary: Collect and attach reviewed intent evidence
      description: Explicit provider reads for a ready, human-confirmed inline measurement.
        Saves a server-generated receipt at an exact conversation version. No client report
        uploads, implicit history, measurement confirmation, approval or resource application.
        Request at most 4 KiB; overall deadline 80 seconds. Partial and unsupported reports
        remain explicit as-of evidence. Frozen change sets cannot be refreshed.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentConversation'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
