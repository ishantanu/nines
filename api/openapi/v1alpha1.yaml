openapi: 3.1.1
info:
  title: 'Nines HTTP API: reviewed SLO workflows'
  version: 0.1.0-alpha.4
  description: Versioned initial contract for the listed operations only. Other server endpoints and complete
    resource schemas are not yet covered. Resource manifests use nines.dev/v1alpha1; existing HTTP paths
    are not URL-versioned.
servers:
- url: /
  description: The configured Nines server origin.
security:
- bearerAuth: []
paths:
  /api/intents/evidence:
    post:
      operationId: prepareIntentEvidence
      summary: Read measurement evidence and compare explicit SLO choices
      description: Read-only preview for an exact inline intent, measurement, tenant/source/catalog
        provenance and expected saved revision. Baseline plus at most two explicit alternatives.
        One metadata adapter call and up to three recent-window calls; explicit history
        adds up to three historical calls. Ten seconds per adapter call, seventy-five
        seconds overall. Each recent read samples five completed cutoffs. Historical
        range at most 72h and 240 cutoffs per comparison; rolling lookback extends before
        that range by up to 31 days. No overlapping count sums, sample writes, target
        selection, confirmation, approvals or deployment. Input at most 32 KiB, output
        at most 128 KiB. Rejects query parameters, duplicate JSON keys and noncanonical
        root fields.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentEvidenceInput'
      responses:
        '200':
          description: As-of preview with explicit quality/freshness gaps, unsupported
            adapters and per-comparison failures. Inspect state; presence is not approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentEvidence'
        '400':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '401':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '403':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '404':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '409':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '429':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '500':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '503':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '504':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
  /api/intents/candidates:
    post:
      operationId: discoverIntentCandidates
      summary: Discover bounded measurement candidates without confirming semantics
      description: Explicit read-only provider inspection. At most one metric-name and
        three series adapter calls, four seconds each within fifteen seconds overall.
        Adapter calls may use several HTTP requests. Maximum request 32 KiB and response
        128 KiB. Unsupported adapters, failures and truncation remain explicit. No model
        calls, samples, resource writes or approvals. Rejects duplicate JSON keys, noncanonical
        fields and query parameters.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentCandidateInput'
      responses:
        '200':
          description: Unverified candidates or explicit capability/failure report;
            inspect state and candidate questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentCandidateDiscovery'
        '400':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '401':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '403':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '404':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '409':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '429':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '500':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '503':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '504':
          description: Invalid scope, authorization failure, revision conflict or unavailable
            bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
  /api/intent-context:
    get:
      operationId: getIntentContext
      summary: Read saved service context for intent preparation
      description: Read-only, bounded tenant context. No upstream telemetry queries, model calls, measurement
        confirmation or approval. Follow nextCursor even when the current page is empty. Source capabilities
        describe adapter interfaces, not tested permissions or live connectivity. Maximum response is 240
        KiB.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: service
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Exact tenant-local ID.
      - name: source
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        description: Exact tenant-local ID.
      - name: project
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Exact tenant-local ID. Project is a metadata filter, not an authorization boundary.
      - name: journey
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        description: Exact tenant-local ID.
      - name: journeyRevision
        in: query
        schema:
          type: integer
          minimum: 1
        description: Required with journey; latest revision must match.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        description: Matching SLO contexts per page; scans at most 100 catalog rows.
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
        description: Opaque cursor from the same tenant and service/source/project/journey scope.
      responses:
        '200':
          description: Saved context snapshot, not verified telemetry or authorization to apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentContext'
        '400':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '401':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '403':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '404':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '409':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '429':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '500':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '503':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
        '504':
          description: Invalid scope, authorization failure, revision conflict or unavailable bounded read.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntentContextFailure'
  /api/slos:
    get:
      operationId: listSLOs
      summary: List SLOs
      description: ''
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SLOView'
        '400': &id001
          $ref: '#/components/responses/Error'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/slos/{id}:
    get:
      operationId: getSLO
      summary: Read an SLO
      description: ''
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - &id002
        $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLOView'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
  /api/slos/{id}/manifest:
