      description: Nines-mediated CLI sign-in through the browser, with PKCE. The CLI listens on a loopback redirect URI. Never log challenge, codeVerifier, code or token. The one-time code from the redirect and the PKCE verifier are exchanged for a tenant token that lasts at most an hour and never outlives the browser session. The token is shown once.
