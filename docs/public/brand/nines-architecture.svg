<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Nines architecture</title>
  <desc id="desc">Applications send telemetry through scraping or an OpenTelemetry Collector to Prometheus or Mimir. Portal, CLI and MCP clients use the tenant-scoped Nines server to define SLOs and critical user journeys, prepare deterministic plans and review changes before applying rules. Rules reach Prometheus through a shared file and optional reload, Mimir through its ruler API, or Kubernetes through a Nines SLO resource reconciled by the Nines operator. Nines queries the backend for measurements and rule output, and inspects deployment status separately. The standalone operator also accepts GitOps resources without the Nines server or database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#80758e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#65519b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #292638; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: 1.6px; fill: #65519b; }
      .title { font-size: 20px; font-weight: 650; letter-spacing: -.4px; }
      .body { font-size: 16px; fill: #696477; }
      .small { font-size: 14px; fill: #696477; }
      .strong { font-size: 16px; font-weight: 600; }
      .line { fill: none; stroke: #80758e; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="870" rx="12" fill="#fffefa"/>
  <g transform="translate(26 13) scale(.4)" fill="none" stroke="#65519b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="38" cy="30" r="21"/>
    <path d="M59 30v22c0 15-10 25-25 25h-7"/>
  </g>
  <text x="68" y="41" font-size="23" font-weight="650" letter-spacing="-.6">Nines architecture</text>
  <text x="1160" y="39" text-anchor="end" class="small">Self-hosted · Prometheus and Mimir</text>
  <path d="M40 65H1160" stroke="#e4e0e9"/>

  <text x="56" y="103" class="label">01 / TELEMETRY</text>
  <rect x="56" y="126" width="300" height="152" rx="8" fill="#f7f6f2" stroke="#dfdce4"/>
  <text x="80" y="162" class="title">Applications</text>
  <text x="80" y="194" class="body">Service and infrastructure metrics</text>
  <text x="80" y="222" class="small">Prometheus endpoints or OTLP</text>
  <text x="80" y="248" class="small">Instrument the signals your SLOs use</text>

  <rect x="450" y="126" width="300" height="152" rx="8" fill="#f7f6f2" stroke="#dfdce4"/>
  <text x="474" y="162" class="title">Collection</text>
  <text x="474" y="194" class="body">Prometheus scraping</text>
  <text x="474" y="222" class="body">or OpenTelemetry Collector</text>
  <text x="474" y="248" class="small">Exports metrics to your backend</text>

  <rect x="850" y="126" width="310" height="152" rx="8" fill="#f0f4f0" stroke="#ccd9cc"/>
  <text x="874" y="162" class="title">Prometheus / Mimir</text>
  <text x="874" y="194" class="body">Query and rule evaluation</text>
  <text x="874" y="222" class="small">Recording rules produce SLI metrics</text>
  <text x="874" y="248" class="small">Burn-rate alerts → Alertmanager</text>
  <path d="M356 202H450" class="line"/>
  <path d="M750 202H850" class="line"/>

  <path d="M850 242H799V332H600V382" fill="none" stroke="#65519b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#feedback)"/>
  <text x="450" y="318" class="small">Measurements + recorded rule output</text>
  <path d="M1005 382V278" class="line"/>
  <text x="1023" y="324" class="small">Load rules</text>
  <text x="1023" y="346" class="small">and evaluate</text>

  <text x="56" y="359" class="label">02 / REVIEWED RULE DELIVERY</text>
  <rect x="56" y="382" width="300" height="274" rx="8" fill="#f7f6f2" stroke="#dfdce4"/>
  <text x="80" y="420" class="title">Define and prepare</text>
  <text x="80" y="455" class="body">Portal · CLI · MCP</text>
  <text x="80" y="485" class="body">Versioned YAML in Git</text>
  <path d="M80 505H332" stroke="#dfdce4"/>
  <text x="80" y="533" class="strong">SLOs + critical user journeys</text>
  <text x="80" y="562" class="small">Explicit ownership and SLO links</text>
  <text x="80" y="597" class="small">Optional models propose intent drafts</text>
  <text x="80" y="622" class="small">CLI validation and generation work offline</text>

  <rect x="450" y="382" width="300" height="274" rx="8" fill="#f1edf8" stroke="#b8a9d0"/>
  <text x="474" y="420" class="title">Nines server</text>
  <text x="474" y="453" class="body">Tenant-scoped API + RBAC</text>
  <text x="474" y="482" class="body">Deterministic rule plans</text>
  <rect x="474" y="506" width="252" height="43" rx="5" fill="#65519b"/>
  <text x="600" y="533" text-anchor="middle" font-size="16" font-weight="600" style="fill:#fff">Review → Apply exact plan</text>
  <text x="474" y="580" class="small">Definitions, revisions and history</text>
  <text x="474" y="606" class="strong">PostgreSQL</text>
  <text x="474" y="632" class="small">In-memory store for the local demo</text>

  <rect x="850" y="382" width="310" height="274" rx="8" fill="#f7f6f2" stroke="#dfdce4"/>
  <text x="874" y="420" class="title">Configured destination</text>
  <text x="874" y="455" class="strong">Prometheus</text>
  <text x="874" y="479" class="small">Shared rule file + opt-in reload</text>
  <path d="M874 495H1136" stroke="#dfdce4"/>
  <text x="874" y="523" class="strong">Mimir</text>
  <text x="874" y="547" class="small">Ruler API → activation by polling</text>
  <path d="M874 563H1136" stroke="#dfdce4"/>
  <text x="874" y="591" class="strong">Nines Kubernetes operator</text>
  <text x="874" y="615" class="small">Nines SLO resource → reconciliation</text>
  <text x="874" y="639" class="small">→ PrometheusRule or Mimir ruler</text>
  <path d="M356 527H450" class="line"/>
  <path d="M750 527H850" class="line"/>

  <rect x="56" y="690" width="1104" height="98" rx="8" fill="#fffefa" stroke="#dfdce4"/>
  <text x="80" y="721" class="label">STANDALONE OPERATOR / ALTERNATIVE ENTRY POINT</text>
  <text x="80" y="756" class="strong">GitOps resources</text>
  <path d="M258 750H318" class="line"/>
  <path d="M510 750H570" class="line"/>
  <text x="340" y="756" class="strong">Nines operator</text>
  <text x="592" y="756" class="strong">PrometheusRule / Mimir ruler</text>
  <text x="1136" y="715" text-anchor="end" class="small">No Nines server or database required</text>
  <text x="1136" y="774" text-anchor="end" class="small">Standalone resources are not imported into the portal</text>

  <path d="M56 819H83" stroke="#65519b" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="94" y="824" class="small">Query feedback</text>
  <text x="1160" y="824" text-anchor="end" class="small">Stored configuration ≠ active evaluation ≠ sufficient SLO coverage</text>
  <text x="56" y="850" class="small">Deployment status is inspected at its destination. Nines does not ingest application telemetry or route alert notifications.</text>
</svg>
