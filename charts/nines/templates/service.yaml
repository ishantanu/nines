apiVersion: v1
kind: Service
metadata:
  name: {{ include "nines.fullname" . }}
  labels:
    {{- include "nines.labels" . | nindent 4 }}
    app.kubernetes.io/name: nines
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nines.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
