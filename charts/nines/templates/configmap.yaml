apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nines.fullname" . }}
  labels:
    {{- include "nines.labels" . | nindent 4 }}
data:
  {{- with .Values.auth.config }}
  auth.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.tenants.config }}
  tenants.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
