{{- if not .Values.credentials.existingSecret }}
{{- $name := include "nines.credentialsSecret" . }}
{{- /* Generated once, then kept: upgrades reuse the stored values. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nines.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: the password and the connection encryption key must
    # survive a reinstall against the same database.
    helm.sh/resource-policy: keep
type: Opaque
data:
  NINES_BOOTSTRAP_PASSWORD: {{ get $existing "NINES_BOOTSTRAP_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  NINES_SOURCE_ENCRYPTION_KEY: {{ get $existing "NINES_SOURCE_ENCRYPTION_KEY" | default (randBytes 32 | b64enc) }}
{{- end }}
