# Copied from https://github.com/pyrra-dev/pyrra (examples/kubernetes/manifests/slos), Apache-2.0.
# Kept as a conformance fixture for the Pyrra importer.
---
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: apiserver-read-resource-latency
  namespace: monitoring
spec:
  description: ""
  indicator:
    latency:
      success:
        metric: apiserver_request_sli_duration_seconds_bucket{verb=~"LIST|GET",le="0.1"}
      total:
        metric: apiserver_request_sli_duration_seconds_count{verb=~"LIST|GET"}
  target: "99"
  window: 2w

---
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: apiserver-read-response-errors
  namespace: monitoring
spec:
  description: ""
  indicator:
    ratio:
      errors:
        metric: apiserver_request_total{component="apiserver",verb=~"LIST|GET",code=~"5.."}
      total:
        metric: apiserver_request_total{component="apiserver",verb=~"LIST|GET"}
  target: "99"
  window: 2w

---
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: kubelet-request-errors
  namespace: monitoring
spec:
  description: ""
  indicator:
    ratio:
      errors:
        metric: rest_client_requests_total{job="kubelet",code=~"5.."}
      total:
        metric: rest_client_requests_total{job="kubelet"}
  target: "99"
  window: 2w
