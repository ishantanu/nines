<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session replay player</title>
    <style>html,body{color:#26252c;background:#f5f5f7;height:100%;margin:0;font:13px system-ui}body{flex-direction:column;display:flex}#controls{background:#fff;border-bottom:1px solid #d8d7de;align-items:center;gap:8px;padding:10px;display:flex}button{color:inherit;background:#fff;border:1px solid #c9c7d1;border-radius:5px;padding:5px 12px}#seek{flex:1;min-width:50px}#status{min-width:52px}#player{flex:1;min-height:200px;position:relative;overflow:hidden}.replayer-wrapper{position:relative}.replayer-wrapper iframe{border:0}.replayer-mouse{z-index:100}</style>
    <script type="module" crossorigin src="/assets/replay-CoEehUMP.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  </head>
  <body>
    <div id="controls">
      <button id="play" disabled>Play</button
      ><button id="pause" disabled>Pause</button
      ><input
        id="seek"
        aria-label="Replay position"
        type="range"
        min="0"
        max="1"
        value="0"
        disabled
      /><span id="status" role="status">Loading</span>
    </div>
    <div id="player"></div>
  </body>
</html>
