<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session replay player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f5f7;
        font: 13px system-ui;
        color: #26252c;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid #d8d7de;
        background: #fff;
      }
      button {
        padding: 5px 12px;
        background: #fff;
        border: 1px solid #c9c7d1;
        border-radius: 5px;
        color: inherit;
      }
      #seek {
        min-width: 50px;
        flex: 1;
      }
      #status {
        min-width: 52px;
      }
      #player {
        flex: 1;
        overflow: hidden;
        position: relative;
        min-height: 200px;
      }
      .replayer-wrapper {
        position: relative;
      }
      .replayer-wrapper iframe {
        border: 0;
      }
      .replayer-mouse {
        z-index: 100;
      }
    </style>
    <script type="module" crossorigin src="/assets/replay-CkOAigr9.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div id="controls">
      <button id="play" disabled>Play</button
      ><button id="pause" disabled>Pause</button
      ><input
        id="seek"
        aria-label="Replay position"
        type="range"
        min="0"
        max="1"
        value="0"
        disabled
      /><span id="status" role="status">Loading</span>
    </div>
    <div id="player"></div>
  </body>
</html>
