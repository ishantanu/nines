apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: commerce
  annotations: {nines.dev/service: api}
spec:
  selector: {app: api}
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: commerce
  annotations: {nines.dev/service: database}
spec:
  selector: {app: database}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: commerce}
spec:
  replicas: 0
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: example.invalid/api:fixture
          env:
            - {name: DATABASE_URL, value: 'postgres://database.commerce.svc.cluster.local:5432/checkout'}
            - name: CACHE_HOST
              valueFrom:
                secretKeyRef: {name: private-cache-reference, key: host}
            - {name: DEBUG_TOKEN, value: not-for-discovery}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: public, namespace: commerce}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allowed-traffic, namespace: commerce}
spec: {podSelector: {}, policyTypes: [Egress]}
