  want: window_below_target
- name: complete-window-meets-target
  context:
    resource: {id: checkout}
    measurement: {dataStatus: complete, coverage: 1, target: 0.99, reliability: 0.995}
  want: window_within_target
- name: incompatible-contract-blocks-comparison
