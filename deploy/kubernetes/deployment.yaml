apiVersion: apps/v1
kind: Deployment
metadata:
  name: nines
  labels:
    app.kubernetes.io/name: nines
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nines
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nines
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nines
          # Replace locally with your reviewed image; no public image is assumed.
          image: nines:local
          imagePullPolicy: IfNotPresent
          args: ['-addr', '0.0.0.0:8080']
          env:
            - name: AUTH_CONFIG_FILE
              value: /etc/nines/auth.yaml
          envFrom:
            - secretRef:
                name: nines-runtime
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: auth-config
              mountPath: /etc/nines
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: auth-config
          configMap:
            name: nines-auth
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
