# Optional: grant only the namespaces explicitly enabled in tenant configuration.
# Create namespaces nines and commerce first; replace them for your installation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nines-discovery
  namespace: nines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nines-discovery
  namespace: commerce
rules:
  - apiGroups: ['']
    resources: [services]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nines-discovery
  namespace: commerce
subjects:
  - kind: ServiceAccount
    name: nines-discovery
    namespace: nines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nines-discovery
