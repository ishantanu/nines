# One-time upgrade from v1alpha1 to v1beta1 SLO, journey and binding resources.
# See docs/public/deployment/operator.md#upgrade-to-v1beta1 for the full steps.
# It needs cluster-wide access because the CRDs, and the resources they hold,
# span every namespace. Delete all of this once the Job has succeeded.
apiVersion: v1
kind: Namespace
metadata:
  name: nines-migrate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nines-migrate
  namespace: nines-migrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nines-migrate
rules:
  - apiGroups: [nines.dev]
    resources: [servicelevelobjectives, criticaluserjourneys, measurementbindings]
    verbs: [get, list, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [servicelevelobjectives.nines.dev, criticaluserjourneys.nines.dev, measurementbindings.nines.dev]
    verbs: [get]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions/status]
    resourceNames: [servicelevelobjectives.nines.dev, criticaluserjourneys.nines.dev, measurementbindings.nines.dev]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nines-migrate
subjects:
  - kind: ServiceAccount
    name: nines-migrate
    namespace: nines-migrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nines-migrate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nines-migrate
  namespace: nines-migrate
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: nines-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          # The release you are upgrading to; it must match operator.yaml.
          image: ghcr.io/ishantanu/nines-operator:v0.1.0-alpha.4
          imagePullPolicy: IfNotPresent
          args: [migrate]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
