                                                - name
                                                - below
                                                - response
                                            type: object
                                        maxItems: 1000
                                        type: array
                                    onExhausted:
                                        enum:
                                            - blocked
                                            - review_required
                                        type: string
                                    owner:
                                        type: string
                                    reviewBelow:
                                        maximum: 1
                                        minimum: 0
                                        type: number
                                    runbookURL:
                                        type: string
                                required:
                                    - owner
                                    - runbookURL
                                    - reviewBelow
                                type: object
                            intervals:
                                nullable: true
                                properties:
                                    errorRate:
                                        type: number
                                    minEvents:
                                        type: number
                                    minGoodEvents:
                                        type: number
                                required: []
                                type: object
                            labels:
                                additionalProperties:
                                    maxLength: 63
                                    minLength: 1
                                    type: string
                                maxProperties: 8
                                type: object
                            lifecycle:
                                enum:
                                    - experimental
                                    - aspirational
                                    - committed
                                    - deprecated
                                type: string
                            measurement:
                                nullable: true
                                properties:
                                    countFrom:
                                        type: string
                                    eventMetric:
                                        type: string
                                    labels:
                                        additionalProperties:
                                            type: string
                                        maxProperties: 1000
                                        type: object
                                    metric:
                                        type: string
                                    observationPoint:
                                        type: string
                                    scrapeInterval:
                                        maxLength: 32
                                        nullable: true
                                        pattern: ^([0-9]+(d|h|m|s|ms))+$
                                        type: string
                                    successLabels:
                                        additionalProperties:
                                            type: string
                                        maxProperties: 1000
                                        type: object
                                    threshold:
                                        maxLength: 32
                                        nullable: true
                                        pattern: ^([0-9]+(d|h|m|s|ms))+$
                                        type: string
                                    type:
                                        type: string
                                required:
                                    - type
                                    - metric
                                    - observationPoint
                                type: object
                            policies:
                                items:
                                    properties:
                                        burnRate:
                                            type: number
                                        confidence:
                                            maximum: 0.9999
                                            minimum: 0
                                            type: number
                                        for:
                                            maxLength: 32
                                            nullable: true
                                            pattern: ^([0-9]+(d|h|m|s|ms))+$
                                            type: string
                                        longWindow:
                                            maxLength: 32
                                            pattern: ^([0-9]+(d|h|m|s|ms))+$
                                            type: string
                                        minCoverage:
                                            nullable: true
                                            type: number
                                        minEvents:
                                            maximum: 1e+18
                                            minimum: 0
                                            type: number
                                        name:
                                            type: string
                                        severity:
                                            type: string
                                        shortWindow:
                                            maxLength: 32
                                            pattern: ^([0-9]+(d|h|m|s|ms))+$
                                            type: string
                                    required:
                                        - shortWindow
                                        - longWindow
                                        - burnRate
                                    type: object
                                maxItems: 1000
                                nullable: true
                                type: array
                            quality:
                                nullable: true
                                properties:
                                    cohortLabels:
                                        items:
                                            pattern: ^[a-zA-Z_][a-zA-Z0-9_]{0,99}$
                                            type: string
                                        maxItems: 3
                                        type: array
                                        x-kubernetes-list-type: set
                                    maxSampleAge:
                                        maxLength: 32
                                        nullable: true
                                        pattern: ^([0-9]+(d|h|m|s|ms))+$
                                        type: string
                                    minEvents:
                                        maximum: 1e+18
                                        minimum: 0
                                        type: number
                                required: []
                                type: object
                            queries:
                                nullable: true
                                properties:
                                    good:
                                        type: string
                                    language:
                                        type: string
                                    total:
                                        type: string
                                    window:
                                        nullable: true
                                        properties:
                                            bad:
                                                type: string
                                            good:
                                                type: string
                                            scrapeInterval:
                                                maxLength: 32
                                                nullable: true
                                                pattern: ^([0-9]+(d|h|m|s|ms))+$
                                                type: string
                                            total:
                                                type: string
                                        required:
                                            - total
                                        type: object
                                required: []
                                type: object
                            service:
                                type: string
                            step:
                                maxLength: 32
                                nullable: true
                                pattern: ^([0-9]+(d|h|m|s|ms))+$
                                type: string
                            target:
                                type: number
                            window:
                                maxLength: 32
                                nullable: true
                                pattern: ^([0-9]+(d|h|m|s|ms))+$
                                type: string
                        required:
                            - displayName
                            - service
                            - target
                        type: object
                        x-kubernetes-validations:
                            - message: use at most one of measurement, queries or binding
                              rule: '[has(self.measurement), has(self.queries), has(self.binding)].filter(x, x).size() <= 1'
                    status:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                required:
                    - spec
                type: object
          served: true
          storage: true
          subresources:
            status: {}
