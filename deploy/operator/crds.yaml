                                    - name
                                    - revision
                                    - digest
                                type: object
                            connection:
                                type: string
                            customers:
                                nullable: true
                                properties:
                                    customers:
                                        items:
                                            properties:
                                                name:
                                                    type: string
                                                target:
                                                    nullable: true
                                                    type: number
                                                value:
                                                    type: string
                                            required:
                                                - value
                                            type: object
                                        maxItems: 1000
                                        type: array
                                    label:
                                        type: string
                                required:
                                    - label
                                    - customers
                                type: object
                            displayName:
                                type: string
                            errorBudgetPolicy:
                                nullable: true
                                properties:
                                    bands:
                                        items:
                                            properties:
                                                below:
                                                    type: number
                                                name:
                                                    type: string
                                                response:
                                                    type: string
