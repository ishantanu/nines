global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/nines/*.yaml
scrape_configs:
  - job_name: playground-checkout
    static_configs:
      - targets: [sample:8000]
remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: playground
    write_relabel_configs:
      # Each backend evaluates its own Nines group. Ship only source metrics.
      - source_labels: [nines_managed]
        regex: 'true'
        action: drop
