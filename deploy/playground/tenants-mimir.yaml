tenants:
  - id: prometheus
    name: Playground Prometheus
    access:
      - tokenEnv: API_TOKEN
        role: owner
    source:
      kind: prometheus
      url: http://prometheus:9090
      rules:
        namespace: playground
        directory: /rules
  - id: mimir
    name: Playground Mimir
    access:
      - tokenEnv: API_TOKEN
        role: owner
    source:
      kind: mimir
      url: http://mimir:9009/prometheus
      mimirOrgID: playground
      rules:
        namespace: playground
        rulerURL: http://mimir:9009/prometheus
