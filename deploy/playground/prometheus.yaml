global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/nines/*.yaml
scrape_configs:
  - job_name: playground-checkout
    static_configs:
      - targets: [sample:8000]
  - job_name: playground-ai
    file_sd_configs:
      - files: [/etc/prometheus/ai-targets.json]
        refresh_interval: 5s

  - job_name: playground-service-graph
    file_sd_configs:
      - files: [/etc/prometheus/topology-targets.json]
        refresh_interval: 5s
