name: Rebuild portal for Dependabot
# Dependabot updates web dependencies but cannot run the build, so CI's check
# that internal/httpapi/web matches the source fails on every such PR. This
# rebuilds the embedded portal and commits only those generated files.
#
# The build runs dependency code, so it gets a read-only token. A separate job
# with write access runs no npm at all: it takes the built files, refuses any
# change outside internal/httpapi/web, commits, and starts CI, because pushes
# made with GITHUB_TOKEN do not trigger workflows.
on:
  pull_request:
    paths:
      - web/package.json
      - web/package-lock.json
permissions:
  contents: read
concurrency:
  group: dependabot-portal-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and rebuild the embedded portal
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm test --prefix web
          npm run build --prefix web
      - name: Detect changed portal files
        id: diff
        run: |
          git add -A internal/httpapi/web
          if git diff --cached --quiet -- internal/httpapi/web; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- internal/httpapi/web | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal
          path: internal/httpapi/web/
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Refuse if the branch moved since the build
        env:
          BUILT: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BUILT" ]; then
            echo "The branch changed after the build; the next run rebuilds it."
            exit 1
          fi
      - name: Replace the embedded portal with the built files
        run: rm -rf internal/httpapi/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portal
          path: internal/httpapi/web
      - name: Commit only generated portal files and start CI
        run: |
          set -euo pipefail
          git add -A
          outside=$(git diff --cached --name-only | grep -v '^internal/httpapi/web/' || true)
          if [ -n "$outside" ]; then
            printf 'Refusing to commit files outside internal/httpapi/web:\n%s\n' "$outside"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Rebuild embedded portal for updated web dependencies"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          printf 'Committed the rebuilt portal to %s and started CI.\n' "$BRANCH" >> "$GITHUB_STEP_SUMMARY"
