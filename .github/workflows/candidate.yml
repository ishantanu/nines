name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example v0.1.0-alpha.1'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Publication preflight and candidate preparation
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 scripts/release/source.py --publication
          make ui
          git diff --exit-code -- internal/httpapi/web
          go mod download
          python3 scripts/release/build.py --version "$CANDIDATE_VERSION" --require-clean
      - name: Verify archives and smoke-test Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify.py --directory dist/releases --version "$CANDIDATE_VERSION" --commit "$GITHUB_SHA"
          smoke_dir=$(mktemp -d)
          tar -xzf "dist/releases/nines_${CANDIDATE_VERSION}_linux_amd64.tar.gz" -C "$smoke_dir"
          "$smoke_dir/nines-operator" -version
          "$smoke_dir/nines" version --agent
          "$smoke_dir/nines" validate --offline -f "$smoke_dir/examples/api-availability.slo.yaml" --agent
          python3 scripts/release/smoke.py --binary "$smoke_dir/nines-server"
      - name: Upload reviewable assets without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nines-candidate
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows archive smoke test
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nines-candidate
          path: candidate
      - name: Run the Windows CLI, server and MCP binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive "candidate/nines_${env:CANDIDATE_VERSION}_windows_amd64.zip" -DestinationPath nines
          Set-Location nines
          foreach ($exe in 'nines.exe', 'nines-server.exe', 'nines-mcp.exe') {
            if (-not (Test-Path $exe)) { throw "missing $exe" }
          }
          if (Test-Path 'nines-operator.exe') { throw 'the operator is Linux-only' }
          .\nines.exe version --agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\nines.exe validate --offline -f examples/api-availability.slo.yaml --agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Write, rewrite and read the private CLI configuration under %AppData%.
          .\nines.exe config set-context smoke --server http://127.0.0.1:8080 --tenant default --agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\nines.exe config use-context smoke --agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\nines.exe config get-contexts --agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
