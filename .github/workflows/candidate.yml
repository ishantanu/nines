name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example v0.1.0-alpha.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ''
      VITE_POSTHOG_PROJECT_TOKEN: ''
      VITE_POSTHOG_HOST: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Publication preflight and candidate preparation
        run: |
          python3 scripts/release/source.py --publication
          make ui
          git diff --exit-code -- internal/httpapi/web
          go mod download
          python3 scripts/release/build.py --version "$CANDIDATE_VERSION" --require-clean
      - name: Upload reviewable assets without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nines-candidate
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
