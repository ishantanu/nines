name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example v0.1.0-alpha.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ''
      VITE_POSTHOG_PROJECT_TOKEN: ''
      VITE_POSTHOG_HOST: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Publication preflight and candidate preparation
        run: |
          python3 scripts/release/source.py --publication
          make ui
          git diff --exit-code -- internal/httpapi/web
          go mod download
          python3 scripts/release/build.py --version "$CANDIDATE_VERSION" --require-clean
      - name: Upload reviewable assets without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nines-candidate
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
