name: Alpha release
on:
  push:
    tags: ['v*-alpha.*']
permissions:
  contents: read
concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an alpha tag on a tested main commit
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$GITHUB_SHA" -f status=completed -F per_page=100 > "$RUNNER_TEMP/ci-runs.json"
          python3 - "$RUNNER_TEMP/ci-runs.json" <<'PY'
          import json, os, sys
          runs = json.load(open(sys.argv[1]))["workflow_runs"]
          if not any(r["head_sha"] == os.environ["GITHUB_SHA"] and r["conclusion"] == "success" for r in runs):
              raise SystemExit("The tagged commit must have a successful main-branch CI run before release. Wait for CI, then rerun this workflow.")
          PY
          # The shipped manifests must reference the images this tag publishes.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          grep -qF "image: ghcr.io/${owner}/nines:${GITHUB_REF_NAME}" deploy/kubernetes/deployment.yaml ||
            { echo "deploy/kubernetes/deployment.yaml must use ghcr.io/${owner}/nines:${GITHUB_REF_NAME}"; exit 1; }
          grep -qF "image: ghcr.io/${owner}/nines-operator:${GITHUB_REF_NAME}" deploy/operator/operator.yaml ||
            { echo "deploy/operator/operator.yaml must use ghcr.io/${owner}/nines-operator:${GITHUB_REF_NAME}"; exit 1; }
          grep -qxF "version: ${GITHUB_REF_NAME#v}" charts/nines/Chart.yaml && grep -qxF "appVersion: ${GITHUB_REF_NAME}" charts/nines/Chart.yaml ||
            { echo "charts/nines/Chart.yaml must have version ${GITHUB_REF_NAME#v} and appVersion ${GITHUB_REF_NAME}"; exit 1; }
          printf 'version=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
  prepare:
    needs: validate
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  images:
    # Multi-architecture images from the same tested commit, published under
    # the version tag only. There is no `latest` while Nines is pre-release.
    needs: [validate, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      server: ${{ steps.server.outputs.digest }}
      operator: ${{ steps.operator.outputs.digest }}
    env:
      ALPHA_VERSION: ${{ needs.validate.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          printf 'date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          printf 'registry=%s\n' "${REGISTRY,,}" >> "$GITHUB_OUTPUT"
      # The final server stage installs CA certificates with apk, which runs on
      # the target architecture; build stages cross-compile on the runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Smoke-test the server image before publishing
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --build-arg VERSION="$ALPHA_VERSION" --build-arg COMMIT="$GITHUB_SHA" \
            --tag nines-release-smoke .
          token="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$token"
          container=$(docker run -d --publish 127.0.0.1::8080 --env API_TOKEN="$token" nines-release-smoke -demo)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "$container")
          for i in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz" >/dev/null; then break; fi
            sleep 1
          done
          NINES_SMOKE_API_TOKEN="$token" python3 scripts/release/smoke.py \
            --url "http://127.0.0.1:${port}" --token-env NINES_SMOKE_API_TOKEN
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.registry }}/nines:${{ env.ALPHA_VERSION }}
          build-args: |
            VERSION=${{ env.ALPHA_VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.title=nines
            org.opencontainers.image.description=Nines server and MCP server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ALPHA_VERSION }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push the operator image
        id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.registry }}/nines-operator:${{ env.ALPHA_VERSION }}
          build-args: |
            VERSION=${{ env.ALPHA_VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.title=nines-operator
            org.opencontainers.image.description=Nines Kubernetes operator
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ALPHA_VERSION }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Record build provenance for the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.registry }}/nines
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: Record build provenance for the operator image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.registry }}/nines-operator
          subject-digest: ${{ steps.operator.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign both images by digest with keyless Cosign
        shell: bash
        env:
          SERVER: ${{ steps.meta.outputs.registry }}/nines@${{ steps.server.outputs.digest }}
          OPERATOR: ${{ steps.meta.outputs.registry }}/nines-operator@${{ steps.operator.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$SERVER"
          cosign sign --yes "$OPERATOR"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/alpha-release.yml@${GITHUB_REF}"
          for image in "$SERVER" "$OPERATOR"; do
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" >/dev/null
          done
          {
            printf 'Published and signed:\n\n'
            printf -- '- `%s`\n' "$SERVER" "$OPERATOR"
          } >> "$GITHUB_STEP_SUMMARY"
  chart:
    # The Helm chart, pinned to the image digests just published, as a signed
    # OCI artifact: oci://ghcr.io/OWNER/charts/nines.
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      ALPHA_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Package the chart with the release's image digests
        shell: bash
        env:
          SERVER_DIGEST: ${{ needs.images.outputs.server }}
          OPERATOR_DIGEST: ${{ needs.images.outputs.operator }}
        run: |
          set -euo pipefail
          python3 scripts/release/chart.py --out "$RUNNER_TEMP/chart/nines" \
            --server-digest "$SERVER_DIGEST" --operator-digest "$OPERATOR_DIGEST"
          helm template nines "$RUNNER_TEMP/chart/nines" --set database.existingSecret=db --set operator.enabled=true |
            grep -qF "@${SERVER_DIGEST}"
          helm package "$RUNNER_TEMP/chart/nines" --destination "$RUNNER_TEMP/packages"
          test -f "$RUNNER_TEMP/packages/nines-${ALPHA_VERSION#v}.tgz"
      - name: Push and sign the chart
        id: push
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/packages/nines-${ALPHA_VERSION#v}.tgz" "oci://${registry}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | tail -1)
          [ -n "$digest" ]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "${registry}/nines@${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the chart by digest with keyless Cosign
        shell: bash
        env:
          CHART: ${{ steps.push.outputs.reference }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$CHART"
          cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/alpha-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CHART" >/dev/null
          printf 'Published and signed chart: `%s`\n' "$CHART" >> "$GITHUB_STEP_SUMMARY"
  draft:
    needs: [validate, prepare, images, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ALPHA_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify exact-commit binaries
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name nines-candidate --dir dist/releases
          python3 scripts/release/verify.py --directory dist/releases --version "$ALPHA_VERSION" --commit "$GITHUB_SHA"
      - name: Prepare a draft prerelease for maintainer review
        shell: bash
        env:
          SERVER_DIGEST: ${{ needs.images.outputs.server }}
          OPERATOR_DIGEST: ${{ needs.images.outputs.operator }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          notes="$RUNNER_TEMP/notes.md"
          # Relative guide links work on the docs site; point them at it here.
          python3 scripts/release/notes.py docs/public/alpha-release-notes.md > "$notes"
          cat >> "$notes" <<EOF

          ## Container images for this release

          | Image | Pull by digest |
          | ----- | -------------- |
          | Server and MCP server | \`${registry}/nines:${ALPHA_VERSION}@${SERVER_DIGEST}\` |
          | Kubernetes operator | \`${registry}/nines-operator:${ALPHA_VERSION}@${OPERATOR_DIGEST}\` |

          ## Helm chart

          Pinned to the image digests above and signed like the images:

          \`\`\`sh
          helm install nines oci://${registry}/charts/nines --version ${ALPHA_VERSION#v} \\
            --namespace nines --create-namespace --set database.existingSecret=nines-database
          \`\`\`

          Chart digest: \`${CHART_DIGEST}\`
          EOF
          if gh release view "$ALPHA_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, os, sys
          release = json.load(open(sys.argv[1]))
          if not release["isDraft"] or release["targetCommitish"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Refusing to overwrite a published release or a draft for another commit.")
          PY
            gh release upload "$ALPHA_VERSION" dist/releases/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$ALPHA_VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$ALPHA_VERSION" dist/releases/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$GITHUB_SHA" --draft --prerelease \
              --title "Nines $ALPHA_VERSION" --notes-file "$notes"
          fi
          printf 'Draft alpha release prepared: %s\nReview its notes, checksums, binaries and image digests before publishing.\n' "$ALPHA_VERSION" >> "$GITHUB_STEP_SUMMARY"
