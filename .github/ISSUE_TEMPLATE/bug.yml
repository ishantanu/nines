name: Bug report
description: A reproducible Nines failure
body:
  - type: markdown
    attributes:
      value: Do not post credentials, tenant data, replay events or vulnerabilities here. See SECURITY.md.
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Include nines version, OS, deployment mode and provider kind. Redact private identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal synthetic YAML and exact commands; expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Relevant error code, health state and small sanitized logs. Do not attach raw provider data or recordings.
